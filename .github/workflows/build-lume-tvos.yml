name: Build Lume tvOS IPA

# Builds an unsigned tvOS IPA of bilipp/Lume using its "Sideload" build
# configuration (SIDE_LOAD flag: every feature unlocked, no StoreKit), then
# publishes it as a release in THIS repo so ATV Loadly can track it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Lume release tag to build (blank = latest)"
        required: false
        default: ""
      variant:
        description: "Compiler workaround: silopt-off (default, publishes) | onone | inliner-off | inliner-off2 (tests, artifact only)"
        required: false
        default: "silopt-off"
  schedule:
    - cron: "0 20 * * 5" # weekly, Friday 20:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.variant == 'xcode27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve Lume tag
        id: ver
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/bilipp/Lume/releases/latest --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "lume-$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Already built $TAG, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Lume
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: bilipp/Lume
          ref: ${{ steps.ver.outputs.tag }}
          path: Lume

      # Lume references LumeEngine as a local package at ../LumeEngine.
      # Its Package.swift downloads the prebuilt FFmpeg xcframework itself.
      - name: Check out LumeEngine
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: bilipp/LumeEngine
          path: LumeEngine

      # More local packages referenced as ../LumeRecorder/Kit and ../LumeCloud/LumeCloudKit.
      - name: Check out LumeRecorder
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: bilipp/LumeRecorder
          path: LumeRecorder

      - name: Check out LumeCloud
        if: steps.ver.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: bilipp/LumeCloud
          path: LumeCloud

      - name: Select Xcode 26.4
        if: steps.ver.outputs.skip != 'true'
        run: |
          ls /Applications | grep -i '^Xcode' || true
          # Lume requires Xcode 26.4+. Xcode 26.6's Swift 6.3.3 compiler crashes
          # in the SIL optimizer on Lume, so pin 26.4 (fall back to 26.5).
          XC=""
          if [ "${{ inputs.variant }}" = "xcode27" ]; then
            # The author archives with Xcode 27; use the newest 27.x on the xcode-27 image.
            XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          else
            for v in 26.4.1 26.4 26.5; do
              if [ -d "/Applications/Xcode_$v.app" ]; then XC="/Applications/Xcode_$v.app"; break; fi
            done
          fi
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
          # Newer Xcodes no longer bundle the Metal toolchain (needed by KSPlayer).
          if [ "${{ inputs.variant }}" = "xcode27" ]; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi

      - name: Ensure tvOS SDK is installed
        if: steps.ver.outputs.skip != 'true'
        run: |
          xcodebuild -showsdks | grep -i appletvos || sudo xcodebuild -downloadPlatform tvOS
          xcodebuild -showsdks | grep -i appletvos

      - name: Build (Sideload configuration, unsigned)
        if: steps.ver.outputs.skip != 'true'
        working-directory: Lume
        run: |
          # Full output goes to a file (GitHub truncates huge logs); on failure
          # print just the errors and the tail so the cause is visible.
          # Swift 6.x crashes in the SIL optimizer (EarlyPerfInliner) on
          # HueSourceRouter.deinit. Two workarounds, chosen by `variant`.
          VARIANT="${{ inputs.variant }}"
          EXTRA=()
          case "$VARIANT" in
            xcode27) EXTRA=() ;; # full optimization, no workaround
            onone) EXTRA=(SWIFT_OPTIMIZATION_LEVEL=-Onone) ;;
            inliner-off2) EXTRA=('OTHER_SWIFT_FLAGS=$(inherited) -Xllvm -sil-disable-pass=early-inline -Xllvm -sil-disable-pass=EarlyPerfInliner') ;;
            silopt-off) EXTRA=('OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -disable-sil-perf-optzns') ;;
            *)     EXTRA=('OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -disable-sil-perf-optzns') ;;
          esac
          echo "variant=$VARIANT extra=${EXTRA[*]}"
          if ! xcodebuild \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Sideload \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${EXTRA[@]}" \
            build > ../xcodebuild.log 2>&1; then
            echo "===== ERRORS ====="
            grep -nE 'error:|fatal error|BUILD FAILED|The following build commands failed' ../xcodebuild.log | cut -c1-600 | head -60
            echo "===== LAST 60 LINES ====="
            tail -n 60 ../xcodebuild.log | cut -c1-600
            exit 1
          fi

      - name: Upload build log
        if: always() && steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ inputs.variant || 'silopt-off' }}
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package IPA
        if: steps.ver.outputs.skip != 'true'
        run: |
          APP=$(find Lume/build/Build/Products -maxdepth 2 -name '*.app' -path '*appletvos*' | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Lume-tvOS.ipa Payload
          ls -lh Lume-tvOS.ipa

      - name: Upload IPA artifact
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Lume-tvOS-${{ inputs.variant || 'silopt-off' }}
          path: Lume-tvOS.ipa

      - name: Publish release
        if: steps.ver.outputs.skip != 'true' && (inputs.variant == '' || inputs.variant == 'silopt-off')
        run: |
          gh release create "lume-${{ steps.ver.outputs.tag }}" Lume-tvOS.ipa \
            -R "${{ github.repository }}" \
            --title "Lume ${{ steps.ver.outputs.tag }} (tvOS, Sideload build)" \
            --notes "Unsigned tvOS IPA built from bilipp/Lume ${{ steps.ver.outputs.tag }} with the Sideload configuration."
